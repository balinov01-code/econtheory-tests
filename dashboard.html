<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабінет викладача — Економічна теорія</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEFF4; --surface:#FFFFFF; --ink:#172440; --ink-soft:#55607A; --ink-faint:#8891A6;
    --accent:#B8862E; --accent-deep:#8C6417; --accent-soft:#F1E4C8; --line:#DADFE8;
    --correct-bg:#E4F3E8; --correct-ink:#1F6B3B; --wrong-bg:#FBE7E7; --wrong-ink:#A23131;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,-apple-system,sans-serif; line-height:1.5;}
  h1,h2,h3,.serif{font-family:'Spectral',Georgia,serif;}
  .wrap{max-width:1000px; margin:0 auto; padding:28px 20px 60px;}
  header.top{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:26px; border-bottom:1px solid var(--line); padding-bottom:18px;}
  header.top h1{font-size:1.5rem; font-weight:600; margin:0;}
  .btn{display:inline-block; padding:10px 18px; border-radius:8px; border:none; background:var(--ink); color:#fff; font-weight:600; font-size:0.9rem; cursor:pointer;}
  .btn:hover{background:#0e1830;}
  .btn.secondary{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn.secondary:hover{background:var(--bg);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:24px; margin-bottom:20px;}
  input[type=email],input[type=password],input[type=text],textarea,select{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:0.92rem; background:#fff; color:var(--ink); margin-bottom:12px;}
  textarea{min-height:140px; resize:vertical; font-family:monospace; font-size:0.85rem;}
  label{font-size:0.85rem; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:4px;}
  .login-box{max-width:360px; margin:60px auto;}
  .tabs{display:flex; gap:6px; margin-bottom:20px;}
  .tab{padding:9px 18px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:0.9rem; font-weight:600; color:var(--ink-soft);}
  .tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  table{width:100%; border-collapse:collapse; font-size:0.85rem;}
  th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);}
  th{color:var(--ink-soft); font-weight:600; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.02em;}
  tr:hover td{background:var(--bg);}
  .tag{font-size:0.72rem; padding:2px 8px; border-radius:20px; background:var(--bg); color:var(--ink-soft); font-weight:600;}
  .tag.warn{background:var(--wrong-bg); color:var(--wrong-ink);}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .empty-hint{text-align:center; color:var(--ink-faint); padding:30px 0;}
  .code-badge{font-family:monospace; font-weight:700; background:var(--accent-soft); color:var(--accent-deep); padding:2px 8px; border-radius:6px; cursor:pointer;}
  #userBar{display:flex; align-items:center; gap:12px; font-size:0.85rem; color:var(--ink-soft);}
  @media print { .no-print{display:none;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Кабінет викладача — Економічна теорія</h1>
    <div id="userBar" style="display:none;"></div>
  </header>

  <div id="loginPanel" class="panel login-box">
    <h2>Вхід</h2>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="ваш email">
    <label>Пароль</label>
    <input type="password" id="loginPassword" placeholder="пароль">
    <button class="btn" id="loginBtn" style="width:100%;">Увійти</button>
    <p id="loginError" style="color:var(--wrong-ink); font-size:0.85rem; margin-top:10px;"></p>
  </div>

  <div id="mainArea" style="display:none;">
    <div class="tabs no-print">
      <div class="tab active" data-view="results">Результати</div>
      <div class="tab" data-view="students">Студенти</div>
    </div>

    <div id="resultsView">
      <div class="panel">
        <div class="toolbar no-print">
          <select id="groupFilter"><option value="">Усі групи</option></select>
          <button class="btn secondary" id="exportCsvBtn">Завантажити CSV</button>
        </div>
        <div id="resultsTableWrap"><div class="empty-hint">Завантаження…</div></div>
      </div>
    </div>

    <div id="studentsView" style="display:none;">
      <div class="panel">
        <h2 style="font-size:1.05rem;">Додати студентів і згенерувати коди</h2>
        <label>Список студентів (один на рядок, формат: <code>Прізвище Ім'я; Група</code>)</label>
        <textarea id="rosterInput" placeholder="Іваненко Іван; ЕТ-21&#10;Петренко Петро; ЕТ-21"></textarea>
        <button class="btn secondary" id="genCodesBtn">Згенерувати коди</button>
        <div id="genResultWrap" style="margin-top:16px;"></div>
      </div>
      <div class="panel">
        <div class="toolbar no-print">
          <h2 style="font-size:1.05rem; margin:0;">Уже додані студенти</h2>
          <button class="btn secondary" id="printStudentsBtn">Друк</button>
        </div>
        <div id="studentsTableWrap"><div class="empty-hint">Завантаження…</div></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, collection, getDocs, doc, setDoc, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCh6Rablk-wqtjwoLt16pAm9Xotey8oSnM",
  authDomain: "econtheory-tests.firebaseapp.com",
  projectId: "econtheory-tests",
  storageBucket: "econtheory-tests.firebasestorage.app",
  messagingSenderId: "89329400825",
  appId: "1:89329400825:web:887e0ef760a6f1c011db28"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

let allResults = [];
let allStudents = [];

document.getElementById("loginBtn").addEventListener("click", async ()=>{
  const email = document.getElementById("loginEmail").value.trim();
  const pass = document.getElementById("loginPassword").value;
  const errBox = document.getElementById("loginError");
  errBox.textContent = "";
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    errBox.textContent = "Не вдалося увійти: перевірте email і пароль.";
  }
});

onAuthStateChanged(auth, (user)=>{
  if(user){
    document.getElementById("loginPanel").style.display = "none";
    document.getElementById("mainArea").style.display = "block";
    const bar = document.getElementById("userBar");
    bar.style.display = "flex";
    bar.innerHTML = `<span>${user.email}</span>`;
    const signOutBtn = document.createElement("button");
    signOutBtn.className = "btn secondary"; signOutBtn.textContent = "Вийти";
    signOutBtn.addEventListener("click", ()=>signOut(auth));
    bar.appendChild(signOutBtn);
    loadResults();
    loadStudents();
  } else {
    document.getElementById("loginPanel").style.display = "block";
    document.getElementById("mainArea").style.display = "none";
  }
});

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const view = tab.dataset.view;
    document.getElementById("resultsView").style.display = view==="results" ? "block":"none";
    document.getElementById("studentsView").style.display = view==="students" ? "block":"none";
  });
});

async function loadResults(){
  const wrap = document.getElementById("resultsTableWrap");
  try{
    const snap = await getDocs(query(collection(db,"results"), orderBy("timestamp","desc")));
    allResults = snap.docs.map(d=>({id:d.id, ...d.data()}));
    populateGroupFilter();
    renderResultsTable();
  }catch(e){
    wrap.innerHTML = `<div class="empty-hint">Помилка завантаження: ${e.message}</div>`;
  }
}

function populateGroupFilter(){
  const groups = [...new Set(allResults.map(r=>r.group).filter(Boolean))].sort();
  const sel = document.getElementById("groupFilter");
  sel.innerHTML = `<option value="">Усі групи</option>` + groups.map(g=>`<option value="${g}">${g}</option>`).join("");
}
document.getElementById("groupFilter").addEventListener("change", renderResultsTable);

function renderResultsTable(){
  const wrap = document.getElementById("resultsTableWrap");
  const filterGroup = document.getElementById("groupFilter").value;
  const rows = allResults.filter(r=>!filterGroup || r.group===filterGroup);
  if(rows.length===0){ wrap.innerHTML = `<div class="empty-hint">Результатів поки немає</div>`; return; }
  wrap.innerHTML = `<table><thead><tr>
    <th>Дата</th><th>ПІБ</th><th>Група</th><th>%</th><th>Оцінка</th><th>ECTS</th><th>12-б.</th><th></th>
  </tr></thead><tbody>` + rows.map(r=>{
    const date = r.timestamp && r.timestamp.toDate ? r.timestamp.toDate().toLocaleString('uk-UA') : "—";
    const warn = r.terminatedByTabSwitch ? `<span class="tag warn">перервано</span>` : "";
    return `<tr>
      <td>${date}</td>
      <td>${r.studentName || "—"}</td>
      <td>${r.group || "—"}</td>
      <td>${r.pct}%</td>
      <td>${r.grade ? r.grade.national : "—"}</td>
      <td>${r.grade ? r.grade.ects : "—"}</td>
      <td>${r.grade ? r.grade.twelve : "—"}</td>
      <td>${warn}</td>
    </tr>`;
  }).join("") + `</tbody></table>`;
}

document.getElementById("exportCsvBtn").addEventListener("click", ()=>{
  const filterGroup = document.getElementById("groupFilter").value;
  const rows = allResults.filter(r=>!filterGroup || r.group===filterGroup);
  const header = ["Дата","ПІБ","Група","Код","%","Правильних","Всього","Оцінка(нац)","ECTS","12-бальна","Перервано"];
  const csvRows = [header.join(";")];
  rows.forEach(r=>{
    const date = r.timestamp && r.timestamp.toDate ? r.timestamp.toDate().toLocaleString('uk-UA') : "";
    csvRows.push([
      date, r.studentName||"", r.group||"", r.studentCode||"", r.pct, r.correctCount, r.total,
      r.grade?r.grade.national:"", r.grade?r.grade.ects:"", r.grade?r.grade.twelve:"",
      r.terminatedByTabSwitch ? "так":"ні"
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";"));
  });
  const blob = new Blob(["\uFEFF"+csvRows.join("\n")], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "результати_тестів.csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

async function loadStudents(){
  const wrap = document.getElementById("studentsTableWrap");
  try{
    const snap = await getDocs(collection(db,"students"));
    allStudents = snap.docs.map(d=>({code:d.id, ...d.data()}));
    renderStudentsTable();
  }catch(e){
    wrap.innerHTML = `<div class="empty-hint">Помилка завантаження: ${e.message}</div>`;
  }
}

function renderStudentsTable(){
  const wrap = document.getElementById("studentsTableWrap");
  if(allStudents.length===0){ wrap.innerHTML = `<div class="empty-hint">Студентів ще не додано</div>`; return; }
  const sorted = [...allStudents].sort((a,b)=>(a.group||"").localeCompare(b.group||"") || (a.name||"").localeCompare(b.name||""));
  wrap.innerHTML = `<table><thead><tr><th>ПІБ</th><th>Група</th><th>Код</th></tr></thead><tbody>` +
    sorted.map(s=>`<tr><td>${s.name||"—"}</td><td>${s.group||"—"}</td><td><span class="code-badge" title="Клікніть, щоб скопіювати">${s.code}</span></td></tr>`).join("") +
    `</tbody></table>`;
  wrap.querySelectorAll(".code-badge").forEach(el=>{
    el.addEventListener("click", ()=>{
      navigator.clipboard?.writeText(el.textContent);
      el.textContent = "Скопійовано!";
      setTimeout(()=>{ el.textContent = el.dataset.code; }, 1200);
    });
    el.dataset.code = el.textContent;
  });
}

document.getElementById("printStudentsBtn").addEventListener("click", ()=>window.print());

function generateCode(existingCodes){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // без 0,O,1,I,L для читабельності
  let code;
  do{
    code = Array.from({length:6}, ()=>chars[Math.floor(Math.random()*chars.length)]).join("");
  }while(existingCodes.has(code));
  existingCodes.add(code);
  return code;
}

document.getElementById("genCodesBtn").addEventListener("click", async ()=>{
  const raw = document.getElementById("rosterInput").value.trim();
  if(!raw){ return; }
  const existingCodes = new Set(allStudents.map(s=>s.code));
  const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
  const parsed = lines.map(line=>{
    const [name, group] = line.split(";").map(s=>s ? s.trim() : "");
    return { name: name||line, group: group||"", code: generateCode(existingCodes) };
  });

  const genWrap = document.getElementById("genResultWrap");
  genWrap.innerHTML = `<table><thead><tr><th>ПІБ</th><th>Група</th><th>Код</th></tr></thead><tbody>` +
    parsed.map(p=>`<tr><td>${p.name}</td><td>${p.group}</td><td class="code-badge">${p.code}</td></tr>`).join("") +
    `</tbody></table>
    <button class="btn" id="uploadCodesBtn" style="margin-top:14px;">Завантажити у базу (${parsed.length})</button>
    <span id="uploadStatus" style="margin-left:10px; font-size:0.85rem; color:var(--ink-soft);"></span>`;

  document.getElementById("uploadCodesBtn").addEventListener("click", async ()=>{
    const statusEl = document.getElementById("uploadStatus");
    statusEl.textContent = "Завантаження…";
    try{
      for(const p of parsed){
        await setDoc(doc(db, "students", p.code), {name:p.name, group:p.group, createdAt: serverTimestamp()});
      }
      statusEl.textContent = "Готово! Список оновлено нижче.";
      document.getElementById("rosterInput").value = "";
      await loadStudents();
    }catch(e){
      statusEl.textContent = "Помилка: " + e.message;
    }
  });
});
</script>
</body>
</html>
